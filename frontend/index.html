<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen - Gestor de Facturas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: var(--spacing-xl) 0;
        }

        .user-menu {
            position: relative;
        }

        .user-button {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            color: var(--gray-100);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .user-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--bg-dark-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all var(--transition-base);
            z-index: var(--z-dropdown);
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--gray-200);
            text-decoration: none;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--gray-50);
        }

        #viewContainer {
            min-height: 400px;
        }

        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger-500);
            color: white;
            border-radius: var(--radius-full);
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .navbar-link {
            position: relative;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="navbar-brand">
                <img src="assets/logo.png" alt="Clínica San Francisco"
                    style="height: 35px; width: auto; margin-right: 0.75rem;">
                Gestor de Facturas
            </div>

            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="#facturas" class="navbar-link active" data-view="facturas">Facturas</a></li>
                <li><a href="#usuarios" class="navbar-link admin-only hidden" data-view="usuarios">Usuarios</a></li>
                <li><a href="#proveedores" class="navbar-link admin-only hidden" data-view="proveedores">Proveedores</a>
                </li>
                <li><a href="#tipos-soporte" class="navbar-link admin-only hidden" data-view="tipos-soporte">Tipos de
                        Soporte</a></li>
                <li><a href="#busqueda" class="navbar-link search-only hidden" data-view="busqueda">Búsqueda</a></li>
            </ul>

            <div class="user-menu">
                <button class="user-button" id="userButton">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">Usuario</span>
                    <span>▼</span>
                </button>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="#perfil" class="dropdown-item">Mi Perfil</a>
                    <a href="#" class="dropdown-item" id="logoutBtn">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- View Container - Content will be loaded here -->
            <div id="viewContainer">
            </div>
    </main>

    <script type="module" src="index.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
